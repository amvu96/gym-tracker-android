name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (useful from the phone GitHub app,
# which shows a "Run workflow" button).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (first run only — safe if already present)
        run: npx cap add android || npx cap sync android

      - name: Apply native scroll fix (disable WebView overscroll)
        run: |
          mkdir -p android/app/src/main/java/com/nullvault/gymtracker
          cp android-native-reference/MainActivity.java android/app/src/main/java/com/nullvault/gymtracker/MainActivity.java

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
